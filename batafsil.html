<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ yangilik.sarlavha }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background-color: #f8fafc; color: #0f172a; }
        header { background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); color: white; padding: 30px 20px; text-align: center; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow: hidden; }
        img { width: 100%; height: 400px; object-fit: cover; }
        .content { padding: 40px; }
        .date { color: #2563eb; font-weight: 600; background: #eff6ff; padding: 4px 12px; border-radius: 30px; display: inline-block; margin-bottom: 20px; }
        h1 { margin: 0 0 20px 0; font-size: 2.2rem; color: #1e293b; }
        p { color: #334155; line-height: 1.8; font-size: 1.1rem; }
        .back-btn { display: inline-block; margin-top: 30px; color: #1e3a8a; text-decoration: none; font-weight: 600; }
        .back-btn:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <h1>UZBEKISTAN NEWS</h1>
    </header>
    <div class="container">
        <img src="https://picsum.photos/800/500?random={{ yangilik.id }}" alt="Rasm">
        <div class="content">
            <span class="date">📅 {{ yangilik.vaqt }} | Kategoriya: {{ yangilik.kategoriya.upper() }}</span>
            <h1>{{ yangilik.sarlavha }}</h1>
            <p>{{ yangilik.batafsil_matn }}</p>
            <a href="/" class="back-btn">⬅️ Bosh sahifaga qaytish</a>
        </div>
    </div>
</body>
</html>
